plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// --- Groq API key fallback ---------------------------------------------
// The app reads its key at runtime from Internal storage/Turbo Key/
// groq_api_key.txt on the phone (GroqConfig.kt), shared with TurboVoice
// and TurboText. A GROQ_API_KEY line in local.properties (gitignored) is
// only baked in as a fallback for phones without that file, and only in
// debug builds: release APKs are published on the public Releases page,
// where anyone could pull a baked-in key back out.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def groqApiKey = localProps.getProperty('GROQ_API_KEY') ?: ''
// -------------------------------------------------------------------------

// Release signing key, kept out of git: a `keystore.properties` at the repo
// root (see README, "Publishing an update"). Without it, release builds are
// left unsigned so fresh checkouts still build.
def keystoreProps = null
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps = new Properties()
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.turbotranslate.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.turbotranslate.app"
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        if (keystoreProps != null) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "GROQ_API_KEY", "\"${groqApiKey}\""
        }
        release {
            buildConfigField "String", "GROQ_API_KEY", "\"\""
            // Every published release must be signed with this same key, and
            // carry a higher versionCode, or phones refuse the in-app update.
            if (keystoreProps != null) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    // For Groq's Whisper + chat-completions APIs (cloud voice-to-text and
    // translation) — same library/version choice as FlipText, for the
    // same reason: 4.x rather than 5.x, which split into separate
    // JVM/Android artifacts and isn't worth the added Gradle-resolution
    // risk for what we need here.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
