plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// --- Groq API key sourcing ---------------------------------------------
// Pulled in at build time instead of hardcoded in GroqConfig.kt, so it's
// never committed if this project's source gets published (matches how
// TurboText/TurboVoice keep their keys out of their public repos too).
//
// Lookup order:
//   1. A GROQ_API_KEY line in local.properties (this project's own copy —
//      already gitignored, since Android Studio uses it for sdk.dir).
//   2. A "turbo key folder" shared across your Turbo apps, if you point
//      TURBO_KEY_FOLDER at it below (or set that same property in
//      local.properties) — expects a groq.key file inside containing
//      just the key. Ask Claude to wire this to the real path/format if
//      it's structured differently.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def turboKeyFolder = localProps.getProperty('TURBO_KEY_FOLDER')
def groqApiKey = localProps.getProperty('GROQ_API_KEY')
if (groqApiKey == null && turboKeyFolder != null) {
    def keyFile = new File(turboKeyFolder, 'groq.key')
    if (keyFile.exists()) {
        groqApiKey = keyFile.text.trim()
    }
}
if (groqApiKey == null) groqApiKey = ''
// -------------------------------------------------------------------------

android {
    namespace 'com.turbotranslate.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.turbotranslate.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "GROQ_API_KEY", "\"${groqApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    // For Groq's Whisper + chat-completions APIs (cloud voice-to-text and
    // translation) — same library/version choice as FlipText, for the
    // same reason: 4.x rather than 5.x, which split into separate
    // JVM/Android artifacts and isn't worth the added Gradle-resolution
    // risk for what we need here.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
